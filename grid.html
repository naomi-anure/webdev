<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout (2D)</title>
    <style>
        #container {
            display: grid;
            grid-template-columns: minmax(80px, 1fr) 450px 350px;
            grid-template-rows: 80px 200px;
            /* column-gap: 10px;
            row-gap: 10px; */
            gap: 10px 15px; /* row column */
           /* justify-content: space-around; /* start center end, space-between, space-evenly... */
            /* align-content: center; */
            place-content: center space-around;
            height: 800px;
            background-color: dodgerblue;
            padding: 10px;
        }

        #container div {
            background-color: #f1f1f1;
            padding: 15px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div id='container'>
        <!-- <div style="grid-column-start: 1; grid-column-end: 3;"></div> -->
        <!-- <div style="grid-column: 1 / 3; grid-row-start: 1; grid-row-end: 3;"></div> -->
        <div style="grid-column: 1 / span 2; grid-row: 1 / 3;"></div>
        <div></div>
        <div style="justify-self: right; align-self: center; "></div>
        <div style="order: 5">item 4</div>
        <div style="order:4" >item 5</div>
    </div>
</body>
</html>
