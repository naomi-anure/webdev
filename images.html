<!DOCTYPE>
<html>
    <head>
        <title>MERGING</title>
        <style>
            div{
                display:flex;
                justify-content: center;
                align-items:center;
                flex-wrap: wrap;
            }

            div img{
                width: 500px;
                height: 300;
                border: 2px solid rgb(35, 59, 35);
                border-radius:13px;
                box-shadow:4px 7px 7px 0px#00000042;
                cursor: pointer;
                margin:10px;
                transition: 400ms;
            }
            

        div img:hover{
            filter: grayscale(1);
            transform: scale(1.05);


        }
        </style>
    </head>
    <body>
        <div>
            <img src="beautiful-rose-nature.jpg" width="200px height=220px">
            <img src="beautiful-rose-studio.jpg" width="200px height=200px">
            <img src="beautiful-rose-water.jpg"  width="200px height=200px">
            <img src="IMG_6871.JPG" width="250px height=1000px">

        </div>
        <mark style="background-color:aqua">my practical work</mark>
    
    </body>
</html>
