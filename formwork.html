<!DOCTYPE>
<html>
    <head>
        <title>FORM WORK</title>
        <body>
            <form action="result.html" method="GET" enctype="multipart/form-data">
                <div>
                <label for="name">NAME</label>
                <input name="name" id="name" placeholder="username">
                </div>
                <label for email>EMAIL</label>
                <input type="email" name="email" id="email">
                <div>
                    <label>AGE</label>
                    <input type="number" name="age" id="age" min="1" max="20">
                </div>
                <div>
                    <label for date>BIRTHDAY</label>
                    <input type="date" name="date" id="date" min 1999-20-01>
                </div>

                
                    FAVOURITE FOOD
                    <div>
                        <label for banana>Banana</label>
                        <input type="checkbox" name="banana" id="banana">
                    </div>

                    <div>
                        <label for orange>Orange</label>
                        <input type="checkbox" name="orange" id="orange">
                    </div>
                    <div for female>Female</div>  
                    <input type="radio" name="gender" id="female">
                </div>

                <div>
                    <label for male>Male</label>
                    <input type="radio" name="gender" id="male">
                </div>


                <div>
                <label for="eyecolor">EYE COLOR</label>
                    <select name="eyecolor" id="eyecolor">
                        <option value="green">GREEN</option>
                        <option label="red" value="red"></option>
                    </select>
                </div>

                <div>
                    <label for file>FILE</label>
                    <input id="file" type="file" name="file">
                </div>
                <div>
                    <label for phone>PHONE</label>       
                    <input type="tel" name="phone" id="phone">
                </div>

                <div>
                    <label for =bio>BIO</label>
                    <textarea name="bio" id="bio"></textarea>
                    
                </div>
                <div>
                <label>PASSWORD</label>
                <input type="password" name="password">
                </div>
                <button type="reset">RESET</button>


                <button type="submit">SUBMIT</button>
            </form>
        </body>
    </head>
</html>
